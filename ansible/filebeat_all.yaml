# создание сервиса сборщика логов filebeat на всех ВМ проекта
---
- name: Universal Filebeat Deployment
  hosts: webservers, elasticsearch, kibana, grafana, prometheus
  become: yes

  tasks:

    # создание Docker вольюмов для filebeat на всех ВМ кроме вебсерверов
    - name: Prepare Filebeat volumes
      set_fact:
        filebeat_volumes:
          - "/etc/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro"
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
          - "/var/lib/docker/containers:/var/lib/docker/containers:ro"

    # создание Docker вольюмов для filebeat на ВМ вебсерверов
    - name: Add Nginx volumes if needed
      set_fact:
        filebeat_volumes: "{{ filebeat_volumes + ['/var/log/nginx:/var/log/nginx:ro'] }}"
      when: "'webservers' in group_names"

    # создание конфигурационных файлов в зависимости от того, на какой ВМ запускается filebeat
    - name: Create Filebeat configuration
      copy:
        dest: /etc/filebeat.yml
        mode: '0644'
        content: |
          filebeat.inputs:
          {% if 'webservers' in group_names %}
          - type: log
            enabled: true
            paths:
              - /var/log/nginx/access.log
              - /var/log/nginx/error.log
          {% endif %}

          {% if 'elasticsearch' in group_names or 'kibana' in group_names or 'grafana' in group_names or 'prometheus' in group_names %}
          - type: container
            paths:
              - /var/lib/docker/containers/*/*.log
            processors:
              - add_docker_metadata: ~
          {% endif %}

          output.elasticsearch:
            hosts: ["{{ hostvars['elasticsearch_server']['ansible_host'] }}:9200"]
            protocol: "http" 
          
          logging.level: info

    # запуск filebeat в Docker
    - name: Run Filebeat container
      community.docker.docker_container:
        name: filebeat
        image: docker.elastic.co/beats/filebeat:8.11.1
        state: started
        recreate: yes
        restart_policy: always
        user: root
        volumes: "{{ filebeat_volumes }}"
        command: ["filebeat", "-e", "--strict.perms=false"]
